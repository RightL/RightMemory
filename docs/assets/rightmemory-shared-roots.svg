<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How RightMemory roots collaborate</title>
  <desc id="desc">A diagram showing multiple RightMemory roots collaborating through invitations, shared file views, question views, and notes while preserving private memory boundaries.</desc>
  <rect width="1200" height="620" rx="28" fill="#10151f"/>
  <rect x="36" y="36" width="1128" height="548" rx="18" fill="#17202c" stroke="#2d3a4e" stroke-width="2"/>

  <text x="64" y="90" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">Many memory roots</text>
  <text x="64" y="128" fill="#9fb0c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Teams of agents can exchange selected memory without merging every private context store.</text>

  <rect x="78" y="206" width="300" height="250" rx="18" fill="#0f1722" stroke="#8bd3ff" stroke-width="2"/>
  <text x="228" y="250" text-anchor="middle" fill="#8bd3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Provider root</text>
  <text x="228" y="290" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">private MEMORY.md</text>
  <text x="228" y="322" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">shared view source</text>
  <text x="228" y="354" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">approval boundary</text>
  <text x="228" y="404" text-anchor="middle" fill="#9fb0c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">publishes only what it chooses</text>

  <rect x="822" y="206" width="300" height="250" rx="18" fill="#0f1722" stroke="#9be7c3" stroke-width="2"/>
  <text x="972" y="250" text-anchor="middle" fill="#9be7c3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Consumer root</text>
  <text x="972" y="290" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">local MEMORY.md</text>
  <text x="972" y="322" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">accepted context</text>
  <text x="972" y="354" text-anchor="middle" fill="#e5edf7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">local decisions</text>
  <text x="972" y="404" text-anchor="middle" fill="#9fb0c5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">keeps its own memory root</text>

  <rect x="454" y="182" width="292" height="76" rx="14" fill="#121b26" stroke="#2f4058"/>
  <text x="600" y="214" text-anchor="middle" fill="#ffd166" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Invitation</text>
  <text x="600" y="239" text-anchor="middle" fill="#d7e1ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">establishes a relationship</text>

  <rect x="454" y="286" width="292" height="76" rx="14" fill="#121b26" stroke="#2f4058"/>
  <text x="600" y="318" text-anchor="middle" fill="#ffd166" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Shared file view</text>
  <text x="600" y="343" text-anchor="middle" fill="#d7e1ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">selected context as files</text>

  <rect x="454" y="390" width="292" height="76" rx="14" fill="#121b26" stroke="#2f4058"/>
  <text x="600" y="422" text-anchor="middle" fill="#ffd166" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Question view + notes</text>
  <text x="600" y="447" text-anchor="middle" fill="#d7e1ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">ask narrowly, respond, clarify</text>

  <path d="M378 220 C410 220 422 220 446 220" stroke="#ffd166" stroke-width="3" fill="none"/>
  <path d="M746 220 C780 220 790 220 822 220" stroke="#ffd166" stroke-width="3" fill="none"/>
  <path d="M822 220 L806 211 L806 229 Z" fill="#ffd166"/>

  <path d="M378 324 C410 324 422 324 446 324" stroke="#8bd3ff" stroke-width="3" fill="none"/>
  <path d="M746 324 C780 324 790 324 822 324" stroke="#8bd3ff" stroke-width="3" fill="none"/>
  <path d="M822 324 L806 315 L806 333 Z" fill="#8bd3ff"/>

  <path d="M822 428 C788 428 778 428 746 428" stroke="#9be7c3" stroke-width="3" fill="none"/>
  <path d="M746 428 L762 419 L762 437 Z" fill="#9be7c3"/>
  <path d="M454 428 C420 428 410 428 378 428" stroke="#9be7c3" stroke-width="3" fill="none"/>
  <path d="M378 428 L394 419 L394 437 Z" fill="#9be7c3"/>

  <rect x="114" y="484" width="972" height="58" rx="14" fill="#121b26" stroke="#2f4058"/>
  <text x="600" y="520" text-anchor="middle" fill="#d7e1ee" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Private roots stay private; shared views expose a controlled surface for collaboration.</text>
</svg>
