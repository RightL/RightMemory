[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rightmemory"
version = "0.1.0"
description = "Tree + graph memory for AI coding agents, stored in local Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "ai-agents",
  "agent-memory",
  "codex",
  "claude-code",
  "markdown",
  "local-first",
  "context-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic-ai>=1.0.0",
]

[project.scripts]
rightmemory = "rightmemory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rightmemory"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "rightmemory/skills"
"rightmemory/prompts" = "rightmemory/prompts"
"rightmemory/semantic_upgrades" = "rightmemory/semantic_upgrades"
