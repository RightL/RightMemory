[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rightmemory"
version = "0.1.0"
description = "Tree + graph memory for AI coding agents, backed by Git-syncable Markdown."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
  "ai-agents",
  "agent-memory",
  "codex",
  "claude-code",
  "markdown",
  "local-first",
  "git-sync",
  "context-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.115.0",
  "mcp>=2,<3",
  "pydantic-ai-slim[anthropic,openai]>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
codex-sdk = [
  "openai-codex==0.147.0",
]

[project.scripts]
rightmemory = "rightmemory.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["rightmemory"]

[tool.hatch.build.targets.wheel.force-include]
"MEMORY.example.md" = "rightmemory/MEMORY.example.md"
"PURSUITS.example.md" = "rightmemory/PURSUITS.example.md"
