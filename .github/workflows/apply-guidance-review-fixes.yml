name: Apply reviewed guidance fixes

on:
  push:
    branches:
      - feat/agent-guidance-inbox

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test tools
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Add review regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_guidance.py")
          text = path.read_text(encoding="utf-8")
          if text.count("import tempfile\n") != 1:
              raise SystemExit("tests/test_guidance.py: import insertion point changed")
          text = text.replace("import tempfile\n", "import os\nimport tempfile\n", 1)

          format_marker = "    def test_three_way_merge_unions_independent_additions(self):\n"
          format_tests = "\n".join(
              [
                  "    def test_validation_rejects_content_before_first_entry(self):",
                  '        malformed = "# Pending Agent Guidance\\n\\nOrphan evidence.\\n"',
                  "        errors = validate_guidance_inbox(malformed)",
                  '        self.assertTrue(any("before first guidance entry" in error for error in errors))',
                  "",
                  "    def test_parser_ignores_reserved_heading_inside_fence(self):",
                  "        fenced = SAMPLE_ONE.replace(",
                  '            "The agent over-structured a simple prompt change.",',
                  '            "```markdown\\n## GI-20260815-deadbeef\\n```\\n\\n"',
                  '            "The agent over-structured a simple prompt change.",',
                  "        )",
                  "        entries = parse_guidance_inbox(fenced)",
                  "        self.assertEqual(len(entries), 1)",
                  '        self.assertIn("## GI-20260815-deadbeef", entries[0].body)',
                  "",
                  "",
              ]
          )
          if text.count(format_marker) != 1:
              raise SystemExit("tests/test_guidance.py: parser-test insertion point changed")
          text = text.replace(format_marker, format_tests + format_marker, 1)

          submit_marker = "    def test_submit_refuses_a_malformed_existing_inbox(self):\n"
          symlink_test = "\n".join(
              [
                  '    @unittest.skipIf(os.name == "nt", "symlink semantics require POSIX")',
                  "    def test_submit_rejects_broken_symlink_inbox(self):",
                  "        inbox = self.root / GUIDANCE_INBOX_PATH",
                  '        target = self.root / "missing-guidance-target"',
                  "        inbox.symlink_to(target)",
                  '        self._git("add", "-f", GUIDANCE_INBOX_PATH)',
                  '        self._git("commit", "-m", "seed broken guidance symlink")',
                  "",
                  "        with self.assertRaises(ValueError):",
                  '            submit_guidance(self.root, "session-one", "Evidence.")',
                  "",
                  "        self.assertFalse(target.exists())",
                  "        self._assert_isolated_cleanup()",
                  "",
                  "",
              ]
          )
          if text.count(submit_marker) != 1:
              raise SystemExit("tests/test_guidance.py: symlink-test insertion point changed")
          text = text.replace(submit_marker, symlink_test + submit_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify new regressions are red
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_guidance.GuidanceFormatTests.test_validation_rejects_content_before_first_entry \
            tests.test_guidance.GuidanceFormatTests.test_parser_ignores_reserved_heading_inside_fence \
            tests.test_guidance.GuidanceSubmitTests.test_submit_rejects_broken_symlink_inbox
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "review regression tests unexpectedly passed before the fixes" >&2
            exit 1
          fi
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/verify-guidance-inbox.yml")
          source = workflow.read_text(encoding="utf-8")
          step = source.index("      - name: Apply reviewed implementation and test fixes\n")
          marker = "          python - <<'PY'\n"
          start = source.index(marker, step) + len(marker)
          end = source.index("\n          PY\n      - name: Compile", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, str(workflow) + ":reviewed-patch", "exec"), {})

          guidance = Path("rightmemory/guidance.py")
          text = guidance.read_text(encoding="utf-8")
          old_guard = "    if path.exists() and (path.is_symlink() or not path.is_file()):\n"
          new_guard = "    if path.is_symlink() or (path.exists() and not path.is_file()):\n"
          if text.count(old_guard) != 1:
              raise SystemExit("rightmemory/guidance.py: regular-file guard changed")
          guidance.write_text(text.replace(old_guard, new_guard, 1), encoding="utf-8")

          install_tests = Path("tests/test_install.py")
          text = install_tests.read_text(encoding="utf-8")
          guidance_line = '                "review-agent-guidance-inbox",\n'
          anchor = '                "memory-retriever",\n'
          if text.count(guidance_line) != 1 or text.count(anchor) != 1:
              raise SystemExit("tests/test_install.py: skill-order expectation changed")
          text = text.replace(guidance_line, "", 1)
          text = text.replace(anchor, anchor + guidance_line, 1)
          install_tests.write_text(text, encoding="utf-8")

          async_tests = Path("tests/test_async_update.py")
          text = async_tests.read_text(encoding="utf-8")
          start_marker = "    def test_submit_replaces_stale_worker_pid_that_belongs_to_another_process(self):\n"
          end_marker = "    def test_submit_creates_and_persists_candidate_uid(self):\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = "\n".join(
              [
                  "    def test_submit_replaces_stale_worker_pid_that_belongs_to_another_process(self):",
                  "        with tempfile.TemporaryDirectory() as tempdir:",
                  '            store = AsyncUpdateStore(Path(tempdir), "update")',
                  '            with patch("rightmemory.async_update.process_identity", return_value="proc:original"):',
                  "                with store._worker_locked():",
                  "                    store._write_worker_locked(",
                  '                        status="running",',
                  "                        pid=4,",
                  "                        batch_id=None,",
                  "                        session_ids=[],",
                  "                        error=None,",
                  "                    )",
                  "            process = Mock(pid=4242)",
                  "",
                  "            with (",
                  '                patch("rightmemory.async_update.subprocess.Popen", return_value=process) as popen,',
                  '                patch("rightmemory.async_update._process_exists", return_value=True),',
                  '                patch("rightmemory.async_update.process_identity", return_value="proc:replacement"),',
                  "            ):",
                  '                state = store.submit("agent-1", "first")',
                  "",
                  "        popen.assert_called_once()",
                  '        self.assertEqual(state.status, "running")',
                  "",
                  "",
              ]
          )
          async_tests.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Compile
        run: python -m compileall -q rightmemory tests
      - name: Focused tests
        shell: bash
        run: |
          python -m unittest tests.test_guidance
          python -m unittest \
            tests.test_install.InstallScriptTests.test_new_root_installs_current_memory_gitignore_allowlist \
            tests.test_install.InstallScriptTests.test_cli_agent_installs_all_user_facing_skills
          python -m unittest \
            tests.test_async_update.AsyncUpdateStateTests.test_submit_replaces_stale_worker_pid_that_belongs_to_another_process
      - name: Full tests
        run: python -m tests
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-guidance-review-fixes.yml
          rm -f .github/workflows/verify-guidance-inbox.yml
          git config user.name "RightMemory Verification"
          git config user.email "rightmemory@localhost"
          git add -A
          git commit -m "fix: finalize agent guidance inbox" -m "Apply model-role isolation, robust inbox parsing and file safety, sync recovery correction, aligned tests, and product documentation after focused and full-suite verification."
          git push origin HEAD:feat/agent-guidance-inbox
