name: Verify final guidance boundaries

on:
  push:
    branches:
      - feat/agent-guidance-inbox

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test tools
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Add boundary regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_guidance.py")
          text = path.read_text(encoding="utf-8")

          format_marker = "    def test_three_way_merge_unions_independent_additions(self):\n"
          format_test = "\n".join(
              [
                  "    def test_validation_rejects_unclosed_fenced_body(self):",
                  "        malformed = SAMPLE_ONE.replace(",
                  '            "The agent over-structured a simple prompt change.",',
                  '            "```markdown\\nThe agent over-structured a simple prompt change.",',
                  "        )",
                  "        errors = validate_guidance_inbox(malformed)",
                  '        self.assertTrue(any("unclosed fenced code block" in error for error in errors))',
                  "",
                  "",
              ]
          )
          if text.count(format_marker) != 1:
              raise SystemExit("tests/test_guidance.py: fence-test insertion point changed")
          text = text.replace(format_marker, format_test + format_marker, 1)

          sync_marker = "    def test_sync_unions_independent_guidance_additions(self):\n"
          sync_test = "\n".join(
              [
                  "    def test_background_sync_does_not_model_repair_invalid_guidance(self):",
                  "        (self.device / GUIDANCE_INBOX_PATH).write_text(",
                  '            "# Wrong Heading\\n", encoding="utf-8"',
                  "        )",
                  '        self._git(self.device, "add", GUIDANCE_INBOX_PATH)',
                  '        self._git(self.device, "commit", "-m", "malformed local guidance")',
                  "        repairs = []",
                  "",
                  "        result = SyncManager(",
                  "            SyncConfig(memory_root=self.device, enabled=True)",
                  "        ).background_sync(active_repair=repairs.append)",
                  "",
                  '        self.assertEqual(result.status, "error")',
                  "        self.assertEqual(result.files, [GUIDANCE_INBOX_PATH])",
                  "        self.assertEqual(repairs, [])",
                  "",
                  "",
              ]
          )
          if text.count(sync_marker) != 1:
              raise SystemExit("tests/test_guidance.py: sync-boundary insertion point changed")
          path.write_text(text.replace(sync_marker, sync_test + sync_marker, 1), encoding="utf-8")
          PY
      - name: Verify regressions are red
        shell: bash
        run: |
          for test in \
            tests.test_guidance.GuidanceFormatTests.test_validation_rejects_unclosed_fenced_body \
            tests.test_guidance.GuidanceSyncTests.test_background_sync_does_not_model_repair_invalid_guidance
          do
            if python -m unittest "$test"; then
              echo "$test unexpectedly passed before its fix" >&2
              exit 1
            fi
          done
      - name: Apply boundary fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guidance = Path("rightmemory/guidance.py")
          text = guidance.read_text(encoding="utf-8")
          anchor = "    preamble_end = starts[0][0] if starts else len(lines)\n"
          addition = (
              '    if fence_char is not None:\n'
              '        errors.append("unclosed fenced code block")\n\n'
          )
          if text.count(anchor) != 1 or addition in text:
              raise SystemExit("rightmemory/guidance.py: fence validation insertion point changed")
          guidance.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

          sync = Path("rightmemory/sync.py")
          text = sync.read_text(encoding="utf-8")
          start = text.index("def _invalid_guidance_result(root: Path) -> SyncResult | None:\n")
          end = text.index("\ndef _utc_now(value: datetime | None = None) -> datetime:\n", start)
          segment = text[start:end]
          if segment.count('        "conflict",\n') != 3:
              raise SystemExit("rightmemory/sync.py: guidance result statuses changed")
          segment = segment.replace('        "conflict",\n', '        "error",\n')
          sync.write_text(text[:start] + segment + text[end:], encoding="utf-8")
          PY
      - name: Compile
        run: python -m compileall -q rightmemory tests
      - name: Focused tests
        run: python -m unittest tests.test_guidance
      - name: Full tests
        run: python -m tests
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -f .github/workflows/verify-guidance-fence.yml
          git config user.name "RightMemory Verification"
          git config user.email "rightmemory@localhost"
          git add -A
          git commit -m "fix: close final guidance boundaries" -m "Reject unclosed fenced evidence before it can absorb later entries, and keep malformed inbox state out of model-based sync repair. Add focused regressions and verify the complete suite."
          git push origin HEAD:feat/agent-guidance-inbox
