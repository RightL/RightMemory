name: Verify guidance inbox

on:
  push:
    branches:
      - feat/agent-guidance-inbox

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final scoped patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'rightmemory/tools.py',
              'from .graph import (\n    PURSUIT_ACTION_RE,\n    PURSUIT_DETAIL_FILE_RE,\n    build_graph_manifest,\n    resolve_backing_reference,\n    validate_item_id,\n)\nfrom .share_models',
              'from .graph import (\n    PURSUIT_ACTION_RE,\n    PURSUIT_DETAIL_FILE_RE,\n    build_graph_manifest,\n    resolve_backing_reference,\n    validate_item_id,\n)\nfrom .guidance import GUIDANCE_INBOX_PATH\nfrom .share_models',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def _is_allowed_read_file(self, path: Path) -> bool:\n        relative_path = path.relative_to(self.memory_root).as_posix()\n        if relative_path == CORRECTIONS_PATH and self.role not in CORRECTIONS_READ_ROLES:',
              '    def _is_allowed_read_file(self, path: Path) -> bool:\n        relative_path = path.relative_to(self.memory_root).as_posix()\n        if relative_path == GUIDANCE_INBOX_PATH:\n            return False\n        if relative_path == CORRECTIONS_PATH and self.role not in CORRECTIONS_READ_ROLES:',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def _is_allowed_read_relative_file(self, relative_path: str) -> bool:\n        if relative_path == CORRECTIONS_PATH and self.role not in CORRECTIONS_READ_ROLES:',
              '    def _is_allowed_read_relative_file(self, relative_path: str) -> bool:\n        if relative_path == GUIDANCE_INBOX_PATH:\n            return False\n        if relative_path == CORRECTIONS_PATH and self.role not in CORRECTIONS_READ_ROLES:',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def _is_allowed_read_command_candidate(self, path: Path) -> bool:\n        if not self._has_role_read_scope():\n            return True\n        relative_path = path.relative_to(self.memory_root).as_posix()',
              '    def _is_allowed_read_command_candidate(self, path: Path) -> bool:\n        relative_path = path.relative_to(self.memory_root).as_posix()\n        if relative_path == GUIDANCE_INBOX_PATH:\n            return False\n        if not self._has_role_read_scope():\n            return True',
          )
          replace_once(
              'rightmemory/tools.py',
              '            relative_path = resolved.relative_to(self.memory_root).as_posix()\n            if self._is_runtime_shared_view_path(relative_path):\n                raise ValueError("runtime shared-view packages are only readable through read_mf")\n            if self._has_role_read_scope():',
              '            relative_path = resolved.relative_to(self.memory_root).as_posix()\n            if relative_path == GUIDANCE_INBOX_PATH:\n                raise ValueError("agent guidance inbox is not available to RightMemory model roles")\n            if self._is_runtime_shared_view_path(relative_path):\n                raise ValueError("runtime shared-view packages are only readable through read_mf")\n            if self._has_role_read_scope():',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def _exclude_runtime_shared_view_rg_paths(self, args: list[str]) -> list[str]:\n        insert_at = args.index("--") if "--" in args else len(args)\n        return [*args[:insert_at], "--glob", f"!{RUNTIME_SHARED_VIEW_PATH_PREFIX}**", *args[insert_at:]]',
              '    def _exclude_runtime_shared_view_rg_paths(self, args: list[str]) -> list[str]:\n        insert_at = args.index("--") if "--" in args else len(args)\n        return [\n            *args[:insert_at],\n            "--glob",\n            f"!{RUNTIME_SHARED_VIEW_PATH_PREFIX}**",\n            "--glob",\n            f"!{GUIDANCE_INBOX_PATH}",\n            *args[insert_at:],\n        ]',
          )
          replace_once(
              'rightmemory/tools.py',
              '        kept = [\n            line\n            for line in output.splitlines()\n            if not line.startswith(RUNTIME_SHARED_VIEW_PATH_PREFIX)\n        ]',
              '        kept = [\n            line\n            for line in output.splitlines()\n            if not line.startswith(RUNTIME_SHARED_VIEW_PATH_PREFIX)\n            and not line.startswith(GUIDANCE_INBOX_PATH)\n        ]',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def _read_command_git(self, args: list[str]) -> str:\n        if args == ["git", "status", "--short"]:\n            return self.git_status()\n        if len(args) >= 2 and args[1] == "diff":\n            self._validate_git_diff_command(args)\n            if self._has_role_read_scope() and len(args) == 2:\n                return self.git_diff()\n            return self._run_git(args)',
              '    def _read_command_git(self, args: list[str]) -> str:\n        if args == ["git", "status", "--short"]:\n            return self.git_status()\n        if args == ["git", "diff"]:\n            return self.git_diff()\n        if len(args) >= 2 and args[1] == "diff":\n            self._validate_git_diff_command(args)\n            return self._run_git(args)',
          )
          replace_once(
              'rightmemory/tools.py',
              '    def git_status(self) -> str:\n        """Return short git status for the RightMemory root."""\n        if self._has_role_read_scope():\n            return self._run_git(["git", "status", "--short", "--", *self._role_read_patterns()])\n        return self._run_git(["git", "status", "--short"])',
              '    def git_status(self) -> str:\n        """Return short git status for the RightMemory root."""\n        if self._has_role_read_scope():\n            return self._run_git(["git", "status", "--short", "--", *self._role_read_patterns()])\n        return self._run_git(\n            ["git", "status", "--short", "--", ".", f":(exclude){GUIDANCE_INBOX_PATH}"]\n        )',
          )
          replace_once(
              'rightmemory/tools.py',
              '        elif self._has_role_read_scope():\n            command.extend(["--", *self._role_read_patterns()])\n        return self._run_git(command)',
              '        elif self._has_role_read_scope():\n            command.extend(["--", *self._role_read_patterns()])\n        else:\n            command.extend(["--", ".", f":(exclude){GUIDANCE_INBOX_PATH}"])\n        return self._run_git(command)',
          )

          replace_once(
              'rightmemory/sync.py',
              '            if self._is_ancestor(candidate_commit, current_head):\n                self._cleanup_recorded_candidate(claimed, require_removed=True)\n                store.complete_commit(record.operation_id, candidate_commit)\n                return self._result_from_record(store.read(record.operation_id) or record)',
              '            if self._is_ancestor(candidate_commit, current_head):\n                self._cleanup_recorded_candidate(claimed, require_removed=True)\n                store.complete_commit(claimed.operation_id, candidate_commit)\n                return self._result_from_record(store.read(claimed.operation_id) or claimed)',
          )

          replace_once(
              'tests/test_guidance.py',
              '    def test_retrieve_file_tools_cannot_see_inbox(self):\n        tools = MemoryTools(self.root, role="retrieve")\n        self.assertNotIn(GUIDANCE_INBOX_PATH, tools.list_files("*.md"))\n        with self.assertRaises(ValueError):\n            tools.read(GUIDANCE_INBOX_PATH)',
              '    def test_model_role_file_tools_cannot_see_inbox(self):\n        for role in (\n            "retrieve",\n            "update",\n            "dreamer",\n            "pruner",\n            "reviewer",\n            "sync-reconciler",\n            "insight",\n        ):\n            with self.subTest(role=role):\n                tools = MemoryTools(self.root, role=role)\n                self.assertNotIn(GUIDANCE_INBOX_PATH, tools.list_files("*.md"))\n                with self.assertRaises(ValueError):\n                    tools.read(GUIDANCE_INBOX_PATH)',
          )
          replace_once(
              'tests/test_guidance.py',
              '        self.assertFalse((self.root / ".runtime" / "async" / "update").exists())\n        self.assertNotIn("rightmemory-guidance-", self._git("branch", "--list"))\n        self._assert_isolated_cleanup()',
              '        self.assertFalse((self.root / ".runtime" / "async" / "update").exists())\n        self.assertNotIn("rightmemory-guidance-", self._git("branch", "--list"))\n\n        marker = "UNREVIEWED-GUIDANCE-MARKER"\n        inbox.write_text(inbox.read_text(encoding="utf-8") + marker + "\\n", encoding="utf-8")\n        tools = MemoryTools(self.root, role="update")\n        self.assertNotIn(marker, tools.git_diff())\n        self.assertNotIn(GUIDANCE_INBOX_PATH, tools.git_status())\n        self._git("checkout", "--", GUIDANCE_INBOX_PATH)\n        self._assert_isolated_cleanup()',
          )

          replace_once(
              'README.md',
              'The default install uses standalone mode, creates `~/.rightmemory`, installs the `rightmemory` CLI, and installs four user-facing skills into both `~/.codex/skills` and `~/.claude/skills`: `memory-retriever` for read-only use, approval-gated `rightmemory-orchestrator`, automatic `rightmemory-auto-orchestrator`, and `maintain-rightmemory` for explicitly requested direct maintenance by the current agent.',
              'The default install uses standalone mode, creates `~/.rightmemory`, installs the `rightmemory` CLI, and installs five user-facing skills into both `~/.codex/skills` and `~/.claude/skills`: `memory-retriever` for read-only use, approval-gated `rightmemory-orchestrator`, automatic `rightmemory-auto-orchestrator`, `maintain-rightmemory` for explicitly requested direct maintenance by the current agent, and `review-agent-guidance-inbox` for explicitly reviewing pending agent guidance before formal admission.',
          )
          replace_once(
              'README.md',
              'Use maintain-rightmemory only when I explicitly ask the current agent to edit RightMemory directly.\n```',
              'Use maintain-rightmemory only when I explicitly ask the current agent to edit RightMemory directly.\nUse review-agent-guidance-inbox when I explicitly ask to review pending agent guidance.\n```',
          )
          replace_once('README.md', 'The four skills are user-selected.', 'The five skills are user-selected.')
          replace_once(
              'README.md',
              '- Four installed skills: read-only retrieval, approval-gated orchestration, automatic orchestration, and explicit direct maintenance.',
              '- Five installed skills: read-only retrieval, approval-gated orchestration, automatic orchestration, explicit direct maintenance, and pending agent-guidance review.',
          )
          replace_once(
              'README.md',
              'After approval, or automatically in auto mode:\n  rightmemory update submit --session <id> "settled evidence and why it may matter"\n\nLater:',
              'After approval, or automatically in auto mode:\n  rightmemory update submit --session <id> "settled evidence and why it may matter"\n\nWhen automatic orchestration encounters settled, potentially reusable agent guidance without an explicit request to remember it:\n  rightmemory guidance submit --session <id> "settled guidance evidence"\n\nThe guidance inbox is synchronized but excluded from ordinary retrieval until the user explicitly reviews and promotes selected entries.\n\nLater:',
          )

          notes = Path('DESIGN_NOTES.md')
          text = notes.read_text(encoding='utf-8')
          section = '''\n\n## Agent Guidance Inbox\n\n`AGENT_GUIDANCE_INBOX.md` is synchronized pending-review evidence, not a fourth semantic module. Automatic orchestration may capture settled, potentially reusable agent guidance there with `rightmemory guidance submit`; explicit requests to remember guidance continue through Update. The inbox is excluded from the graph, ordinary retrieval, shared views, and model-role file tools. A user explicitly invokes `review-agent-guidance-inbox` to decide which entries become Cross-Session Agent Behavior, Agent Corrections, both, or neither. Reviewed entries are removed; Git history is the audit trail.\n'''
          if '## Agent Guidance Inbox' in text:
              raise SystemExit('DESIGN_NOTES.md already contains Agent Guidance Inbox section')
          notes.write_text(text.rstrip() + section, encoding='utf-8')
          PY
          rm .github/workflows/verify-guidance-inbox.yml
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q rightmemory tests
      - name: Focused tests
        run: python -m unittest tests.test_guidance
      - name: Full tests
        run: python -m tests
      - name: Commit verified final tree
        shell: bash
        run: |
          git config user.name "RightMemory Verification"
          git config user.email "rightmemory@localhost"
          git add -A
          git commit -m "feat: finish agent guidance inbox" -m "Apply model-tool isolation, focused product documentation, and the final sync cleanup after compile, focused, and full-suite verification."
          git push origin HEAD:feat/agent-guidance-inbox
