name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node on Linux
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rightmemory/web/frontend/package-lock.json

      - name: Check frontend
        if: runner.os == 'Linux'
        working-directory: rightmemory/web/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Verify committed frontend bundles
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- \
            rightmemory/web/static/pursuit-map.js \
            rightmemory/web/static/pursuit-map.css \
            rightmemory/web/static/pursuit-map.LICENSE.txt

      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress

      - name: Install package
        run: python -m pip install -e ".[codex-sdk]"

      - name: Compile
        run: python -m compileall -q rightmemory tests

      - name: Run tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m tests
